name: Build AAS login debug APK

on:
  push:
    branches:
      - feature/aas-token-login
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Build Vanilla debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleVanillaDebug --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-AAS-vanilla-debug
          path: app/build/outputs/apk/vanilla/debug/*.apk
          if-no-files-found: error
