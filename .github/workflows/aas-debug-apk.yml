name: Build AAS release APK (unsigned)

on:
  push:
    branches:
      - feature/aas-token-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK Platform 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build Vanilla release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testVanillaReleaseUnitTest :app:assembleVanillaRelease --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-AAS-v0.3-unsigned
          path: app/build/outputs/apk/vanilla/release/*-unsigned.apk
          if-no-files-found: error
