name: Build AAS release APK (unsigned)

on:
  push:
    branches:
      - feature/aas-token-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK Platform 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build Vanilla release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testVanillaDebugUnitTest :app:assembleVanillaRelease --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedVanillaDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.aurora.store.util.CredentialCipherTest --no-daemon --stacktrace
      - name: APK SHA-256
        run: sha256sum app/build/outputs/apk/vanilla/release/*-unsigned.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-AAS-v0.3-unsigned
          path: app/build/outputs/apk/vanilla/release/*-unsigned.apk
          if-no-files-found: error
